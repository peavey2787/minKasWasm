<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../styles.css" />
    <meta charset="UTF-8" />
    <title>Kaspa RPC Demo</title>
  </head>
  <body>
    <button id="connectBtn">Connect</button>
    <p id="status">Not connected</p>

    <h2>Run RPC Command</h2>
    <input
      id="rpcCommand"
      type="text"
      size="50"
      value='{"method":"getInfo","params":{}}'
    />
    <button id="runRpcBtn">Run</button>
    <pre id="rpcResult" class="output"></pre>

    <script type="module">
      import { kaspaPortal } from "../wrapper/kaspaPortal.js";

      const status = document.getElementById("status");
      const connectBtn = document.getElementById("connectBtn");
      const runBtn = document.getElementById("runRpcBtn");
      const rpcInput = document.getElementById("rpcCommand");
      const rpcResult = document.getElementById("rpcResult");

      connectBtn.addEventListener("click", async () => {
        status.textContent = "Connecting...";
        try {
          await kaspaPortal.init();
          await kaspaPortal.connect({
            networkId: "testnet-10",
            onDisconnect: () => {
              status.textContent = "Disconnected";
            },
          });
          status.textContent = "Connected";
        } catch (err) {
          status.textContent = "Connection failed: " + err.message;
        }
      });

      runBtn.addEventListener("click", async () => {
        const cmdText = rpcInput.value.trim();
        try {
          const result = await kaspaPortal.runRpcCommand(cmdText);

          // Prettify output
          let pretty = "";
          if (typeof result === "object") {
            pretty = JSON.stringify(result, null, 2);
          } else if (typeof result === "string" && result.includes("\n")) {
            pretty = "<ul style='margin:0;padding-left:1.2em'>";
            for (const line of result.split("\n")) {
              const [key, ...rest] = line.split(":");
              pretty += `<li><strong>${key.trim()}:</strong> ${rest.join(":").trim()}</li>`;
            }
            pretty += "</ul>";
          } else {
            pretty = result;
          }
          rpcResult.innerHTML = pretty;
        } catch (err) {
          rpcResult.textContent = "RPC Error: " + err.message;
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kaspa Block Scanner & Wallet</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="scanner.css">
</head>
<body>
  <div class="scanner-container">
    <h2>Block Scanner</h2>
    <div class="scanner-controls">
      <div class="checkbox-row">
        <label for="publicResolverCheckbox">
          <input type="checkbox" id="publicResolverCheckbox" checked>
          Connect using public resolver
        </label>
      </div> 
      <label for="nodeInput">Node (ip:port or leave blank for resolver):</label>
      <input type="text" id="nodeInput" placeholder="ip:port or leave blank for resolver">    
      <label for="networkInput">Network:</label>
      <select id="networkInput">
        <option value="mainnet">mainnet</option>
        <option value="testnet-10" selected>testnet-10</option>
        <option value="testnet-11">testnet-11</option>
      </select>    
      <button id="connectBtn">Connect</button>    
      <label for="searchInput">Text to search in payloads:</label>
      <input type="text" id="searchInput" placeholder="Text to search in payloads" value="test">    
      <button id="startStopBtn">Start</button>
    </div>
    <div id="statusDiv"></div>
    <iframe id="blocksIframe"
      style="width:100%;max-width:480px;height:250px;border:none;border-radius:8px;background:#232223;box-shadow:0 2px 8px #00000033;display:block;margin:0 auto;"
      srcdoc="<body style='margin:0;background:#232223;color:#49eacb;font-family:Segoe UI,Arial,sans-serif;'></body>"></iframe>
    <div class="matches-container output">
      <strong>Matches Found:</strong>
      <div id="matchesContainer"></div>
    </div>
  </div>
  <div class="indexer-container scanner-container">
    <h2>Transaction Indexer</h2>
    <div class="indexer-controls" style="margin-bottom:1em;display:flex;flex-wrap:wrap;gap:1em;align-items:center;justify-content:center;">
      <label style="margin-bottom:0;">TTL (minutes): <input type="number" id="indexerTtlInput" min="1" max="1440" value="10" style="width:60px;"></label>
      <label style="margin-bottom:0;">Max Size: <input type="number" id="indexerMaxSizeInput" min="1" max="10000" value="500" style="width:80px;"></label>
      <label style="margin-bottom:0;">Priority:
        <label style="margin-left:0.5em;font-weight:normal;"><input type="radio" name="indexerPriority" value="ttl" checked> TTL</label>
        <label style="margin-left:0.5em;font-weight:normal;"><input type="radio" name="indexerPriority" value="size"> Size</label>
      </label>
    </div>
    <div id="indexerCountdown" style="color:#49eacb;font-size:0.95em;margin-bottom:0.5em;"></div>
    <div id="indexerTxs" class="output matches-container" style="max-height:200px;overflow-y:auto;"></div>
  </div>
  <div class="wallet-container">
    <h2>Wallet</h2>
    <div class="wallet-controls">
      <button id="createWalletBtn">Create/Open Wallet</button>
      <span id="walletLoading" style="display:none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;">
          <circle cx="12" cy="12" r="10" stroke="#49eacb" stroke-width="4" stroke-dasharray="60" stroke-dashoffset="40">
            <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/>
          </circle>
        </svg>
        <span style="color:#49eacb;">Creating wallet...</span>
      </span>
      <span><span id="balanceResult" class="wrap-output"></span></span>
      <span>Receiving Address: <span id="receiveAddressLabel" class="wrap-output"></span></span>
      <button id="copyReceiveAddressBtn" class="copyBtn">Copy</button>
    </div>
    <div class="wallet-controls">
      <label for="toAddressInput">To Address:</label>
      <input type="text" id="toAddressInput" placeholder="To Address">
      <label for="amountInput">Amount (KAS):</label>
      <input type="text" id="amountInput" placeholder="Amount" value="1">
      <label for="payloadInput">Payload:</label>
      <input type="text" id="payloadInput" placeholder="Payload (optional)" value="Block scanner test">
      <button id="sendBtn">Send</button>
      <span id="sendResult" class="wrap-output"></span>
    </div>
  </div>
  <script type="module" src="scanner.js"></script>
</body>
</html>

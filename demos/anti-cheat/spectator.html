<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KKTP Anti-Cheat Demo - SPECTATOR</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="anti-cheat.css" />
</head>
<body>
  <div class="container">
    <h1>KKTP Anti-Cheat Demo <span class="role-badge" style="background:var(--accent-dim);">SPECTATOR</span></h1>
    <p style="text-align:center;color:var(--text-muted);margin-bottom:1.5rem;">
      Verifiable Replay & Live Monitoring
    </p>

    <!-- Connection Section -->
    <div class="section-card">
      <div class="section-header">
        <h2>🔌 Connection</h2>
        <span id="connectionStatus" class="status-badge disconnected">Disconnected</span>
      </div>
      <div class="connection-panel">
        <div class="control-group">
          <label for="networkSelect">Network</label>
          <select id="networkSelect">
            <option value="mainnet">Mainnet</option>
            <option value="testnet-10" selected>testnet-10</option>
            <option value="testnet-11">testnet-11</option>
            <option value="testnet-12">testnet-12</option>
          </select>
        </div>
        <div class="control-group">
          <label class="checkbox-label">
            <input type="checkbox" id="usePublicResolver" checked />
            Use Public Resolver
          </label>
        </div>
        <div class="control-group">
          <label for="nodeUrl">Node URL (if not using resolver)</label>
          <input type="text" id="nodeUrl" placeholder="ws://127.0.0.1:17110" disabled />
        </div>
        <button id="connectBtn">Connect</button>
      </div>
    </div>

    <!-- Spectator Section -->
    <div class="game-section">
      <div class="section-header">
        <h2>👁️ Spectator View</h2>
      </div>
      
      <div class="game-row">
        <div class="game-panel" style="flex:1; max-width:100%;">
          <div class="panel-header">
            <h3>Live Feed</h3>
            <div style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
              <span id="spectatorSessionBadge" class="status-badge pending">session: --</span>
              <span id="spectatorLatencyBadge" class="status-badge pending">latency: --</span>
              <span id="spectatorStatus" class="status-badge pending">Not Watching</span>
            </div>
          </div>
          <p class="panel-desc">Connect to the same network as the player to scan for KKTP anchors.</p>
          
          <div class="controls-row" style="margin-bottom:1rem;">
             <div class="control-group">
              <label for="payloadPrefix">Payload Prefix</label>
              <input type="text" id="payloadPrefix" value="KKTP" placeholder="KKTP" style="width:150px;">
            </div>
          </div>

          <div class="controls-row compact">
            <button id="startSpectatorBtn">Watch Live</button>
            <button id="replaySpectatorBtn" class="secondary">Replay Session</button>
            <button id="stopSpectatorBtn" class="danger" disabled>Stop</button>
          </div>

          <div class="game-grid spectator" id="spectatorGrid">
            <!-- 10x10 grid cells will be generated by JS -->
          </div>

          <div class="log-area">
            <strong>Blockchain Log:</strong>
            <div id="spectatorLogPanel" class="output-panel small">No moves received yet.</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>

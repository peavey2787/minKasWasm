<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../styles.css">
    <meta charset="UTF-8">
    <title>Kaspa Demo</title>
  </head>
<body>
  <label for="networkId">Network:</label>
  <select id="networkId">
    <option value="mainnet">Mainnet</option>
    <option value="testnet-12">testnet-12</option>
    <option value="testnet-11">testnet-11</option>
    <option value="testnet-10" selected>testnet-10</option>
  </select>
  </br>
  <button id="connectBtn">Connect</button>
  <p id="status">Not connected</p>

  <h2>Run RPC Command</h2>
  <input id="rpcCommand" type="text" value='{"method":"getInfo","params":{}}'>
  <button id="runRpcBtn">Run</button>
  <pre id="rpcResult" class="output"></pre>

  <h2>Select Existing Wallet</h2>
  <!-- Refresh Wallet List button removed -->
  <select id="walletList"></select>
  <input id="unlockWalletPasswordInput" type="password" placeholder="Wallet password">
  <button id="unlockWalletBtn">Unlock Wallet</button>
  <button id="deleteWalletBtn" style="margin-left:1em;color:#c00;">Delete Wallet</button>
  <button id="showMnemonicBtn" style="margin-left:1em;">Show Mnemonic</button>
  <pre id="unlockWalletResult" class="output"></pre>

  <h2>Create Wallet</h2>
  <input id="walletPasswordInput" type="password" placeholder="Wallet password" style="margin-bottom:0.5em;">
  <input id="walletFilenameInput" type="text" placeholder="Wallet filename (optional)" style="margin-bottom:0.5em;">
  <button id="createWalletBtn">Create Wallet</button>
  <input id="mnemonicInput" type="text" placeholder="Optional mnemonic for import">
  <button id="importWalletBtn">Import Wallet</button>
  <pre id="walletResult" class="output"></pre>

  <h2>Get Balance</h2>
  <button id="getBalanceBtn">Get Balance</button>
  <pre id="balanceResult"></pre>

  <h2>Send Transaction</h2>
  <button id="sendBtn">Send 1 KAS to address</button>
  <input id="sendAddress" type="text" value="">
  <input id="payloadInput" type="text" placeholder="Optional payload">
  <pre id="sendResult"></pre>

  <script type="module">
    import { sompiToKaspaString, } from '../kas-wasm/kaspa.js';
    import { connect } from '../wrapper/kaspa_client.js';
    import { runRpcCommand } from '../wrapper/rpc_runner.js';
    import { init, createWallet, getSpendableBalance, send, getAllWallets, getMnemonic } from '../wrapper/wallet_service.js';
      const showMnemonicBtn = document.getElementById('showMnemonicBtn');
      // Show mnemonic handler
      showMnemonicBtn.addEventListener('click', async () => {
        const filename = walletList.value;
        const password = unlockWalletPasswordInput.value.trim();
        if (!filename) {
          unlockWalletResult.textContent = "Please select a wallet.";
          return;
        }
        if (!password) {
          unlockWalletResult.textContent = "Please enter the wallet password.";
          return;
        }
        unlockWalletResult.textContent = "Fetching mnemonic...";
        try {
          const mnemonic = await getMnemonic(filename, password);
          unlockWalletResult.textContent = `Mnemonic for '${filename}':\n${mnemonic}`;
        } catch (err) {
          unlockWalletResult.textContent = "Failed to fetch mnemonic: " + (err.message || err);
        }
      });
    import { deleteWalletData } from '../wrapper/storage.js';
    const deleteWalletBtn = document.getElementById('deleteWalletBtn');
    // Delete wallet handler
    deleteWalletBtn.addEventListener('click', async () => {
      const filename = walletList.value;
      if (!filename) {
        unlockWalletResult.textContent = "Please select a wallet to delete.";
        return;
      }
      if (!confirm(`Are you sure you want to delete wallet '${filename}'? This action cannot be undone.`)) {
        return;
      }
      unlockWalletResult.textContent = "Deleting wallet...";
      try {
        await deleteWalletData(filename);
        unlockWalletResult.textContent = `Wallet '${filename}' deleted.`;
        await refreshWalletList();
      } catch (err) {
        unlockWalletResult.textContent = "Failed to delete wallet: " + (err.message || err);
      }
    });
  // Refresh Wallet List button removed
  const walletList = document.getElementById('walletList');
  const unlockWalletPasswordInput = document.getElementById('unlockWalletPasswordInput');
  const unlockWalletBtn = document.getElementById('unlockWalletBtn');
  const unlockWalletResult = document.getElementById('unlockWalletResult');
    // Populate wallet list
    async function refreshWalletList() {
      walletList.innerHTML = '';
      unlockWalletResult.textContent = '';
      try {
        const wallets = await getAllWallets();
        if (wallets.length === 0) {
          walletList.innerHTML = '<option value="">No wallets found</option>';
          return;
        }
        wallets.forEach(w => {
          const opt = document.createElement('option');
          opt.value = w.filename;
          opt.textContent = w.title || w.filename;
          walletList.appendChild(opt);
        });
      } catch (err) {
        unlockWalletResult.textContent = "Failed to load wallets: " + (err.message || err);
      }
    }

    // Refresh Wallet List button removed

    // Unlock wallet
    unlockWalletBtn.addEventListener('click', async () => {
      const filename = walletList.value;
      const password = unlockWalletPasswordInput.value.trim();
      if (!filename) {
        unlockWalletResult.textContent = "Please select a wallet.";
        return;
      }
      if (!password) {
        unlockWalletResult.textContent = "Please enter the wallet password.";
        return;
      }
      unlockWalletResult.textContent = "Unlocking wallet...";
      try {
        const result = await createWallet({ password, filename });
        unlockWalletResult.textContent = "Wallet unlocked!\nAddress:\n" + result.address;
        sendAddressInput.value = result.address;
      } catch (err) {
        unlockWalletResult.textContent = "Failed to unlock wallet: " + (err.message || err);
      }
    });

    let client = null;

    const networkId = document.getElementById('networkId');
    const status = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const runBtn = document.getElementById('runRpcBtn');
    const rpcInput = document.getElementById('rpcCommand');
    const rpcResult = document.getElementById('rpcResult');
    const createWalletBtn = document.getElementById('createWalletBtn');
    const importWalletBtn = document.getElementById('importWalletBtn');
    const walletResult = document.getElementById('walletResult');
    const walletPasswordInput = document.getElementById('walletPasswordInput');
    const walletFilenameInput = document.getElementById('walletFilenameInput');
    const getBalanceBtn = document.getElementById('getBalanceBtn');
    const balanceResult = document.getElementById('balanceResult');
    const sendBtn = document.getElementById('sendBtn');
    const sendAddressInput = document.getElementById('sendAddress');
    const payloadInput = document.getElementById('payloadInput');
    const sendResult = document.getElementById('sendResult');

    connectBtn.addEventListener('click', async () => {
      status.textContent = "Connecting...";
      try {
        client = await connect(null, networkId.value, {
          onDisconnect: () => {
            status.textContent = "Disconnected";
          }
        });
        // Initialize wallet after connecting
        init({rpcClient: client, networkId: networkId.value, balanceElementId: "balanceResult"});
        await refreshWalletList();
        status.textContent = "Connected";
      } catch (err) {
        status.textContent = "Connection failed: " + err.message;
      }
    });

    runBtn.addEventListener('click', async () => {
      const cmdText = rpcInput.value.trim();
      const result = await runRpcCommand(client, cmdText);
      rpcResult.textContent = result;
    });

    createWalletBtn.addEventListener('click', async () => {
      walletResult.textContent = "Creating wallet...";
      const password = walletPasswordInput.value.trim() || "password";
      const filename = walletFilenameInput.value.trim() || "demo_wallet";
      try {
        const result = await createWallet({
          password,
          filename,
          storeMnemonic: true
        });
        walletResult.textContent = "Wallet created!\nMnemonic:\n" + result.mnemonic + "\n\nAddress:\n" + result.address;
        sendAddressInput.value = result.address;
      } catch (err) {
        walletResult.textContent = "Wallet creation failed: " + (err.message || err);
      }
    });

    importWalletBtn.addEventListener('click', async () => {
      const mnemonic = mnemonicInput.value.trim();
      const password = walletPasswordInput.value.trim() || "password";
      const filename = walletFilenameInput.value.trim() || "imported_demo_wallet";
      if (!mnemonic) {
        walletResult.textContent = "Import cancelled.";
        return;
      }
      walletResult.textContent = "Importing wallet...";
      try {
        const result = await createWallet({
          password,
          mnemonic,
          filename
        });
        walletResult.textContent = "Wallet imported!\nAddress:\n" + result.address;
        sendAddressInput.value = result.address;
      } catch (err) {
        walletResult.textContent = "Wallet import failed: " + (err.message || err);
      }
    });

    getBalanceBtn.addEventListener('click', async () => {
      balanceResult.textContent = "Fetching balance...";
      try {
        const result = await getSpendableBalance();
        balanceResult.textContent = "Balance:\n" + sompiToKaspaString(result) + " KAS";
      } catch (err) {
        balanceResult.textContent = "Failed to get balance: " + (err.message || err);
      }
    });

    sendBtn.addEventListener('click', async () => {
      const address = sendAddressInput.value.trim();
      sendResult.textContent = "Sending transaction...";
      const payload = payloadInput.value.trim();
      try {
        const sendResultData = await send({
          password: "password",
          amount: 1,
          toAddress: address,
          priorityFeeKas: 0.0,
          payload: ""
        });
        sendResult.textContent = "Transaction sent! TxID: " + sendResultData.transactionIds[0];
      } catch (err) {
        sendResult.textContent = "Transaction failed: " + (err.message || err);
      }
    });
  </script>
</body>
</html>

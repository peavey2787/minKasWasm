<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kaspa Connect Demo</title>
</head>
<body>
  <button id="connectBtn">Connect</button>
  <p id="status">Not connected</p>

  <script type="module">
    import { connect } from './kaspa_client.js'; // Ensure this file is in the same folder as kaspa_client.js or put it outside the folder and change this to '../kaspa_client.js'

    const btn = document.getElementById('connectBtn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      status.textContent = "Connecting...";
      try {
        const client = await connect(null, "mainnet", {
          onDisconnect: () => {
            status.textContent = "Disconnected";
          }
        });
        status.textContent = "Connected";
      } catch (err) {
        status.textContent = "Connection failed: " + err.message;
      }
    });
  </script>
</body>
</html>

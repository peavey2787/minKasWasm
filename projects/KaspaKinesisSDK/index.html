<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaspaKinesisSDK Smoke Test</title>
    <style>
      body { font-family: system-ui, Segoe UI, Arial, sans-serif; padding: 16px; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
      pre { background: #111; color: #ddd; padding: 12px; border-radius: 8px; overflow:auto; }
      button { padding: 8px 12px; }
    </style>
  </head>
  <body>
    <h2>KaspaKinesisSDK Smoke Test</h2>

    <button id="btn">Connect + Open Wallet</button>

    <div style="margin-top:12px">
      <div>Address: <span id="addr" class="mono">--</span></div>
      <div>Balance (mature): <span id="bal">--</span></div>
    </div>

    <h3>Log</h3>
    <pre id="log"></pre>

    <script type="module">
      import { createClient, createWallet } from './dist/index.js';

      const $ = (id) => document.getElementById(id);
      const log = (m) => { $('log').textContent = m + '\n' + $('log').textContent; };

      $('btn').addEventListener('click', async () => {
        try {
          log('Connecting...');
          const client = await createClient({ networkId: 'testnet-10' });

          log('Opening/creating wallet...');
          const wallet = await createWallet({
            networkId: 'testnet-10',
            name: 'kinesis_smoke_wallet',
            password: '1234',
          });

          const addr = await wallet.getAddress();
          $('addr').textContent = addr;

          log('Fetching balance...');
          const bal = await wallet.getBalanceMatureKas();
          $('bal').textContent = bal;

          log('OK: ready');
          // keep references for debugging
          window.__kinesis = { client, wallet };
        } catch (e) {
          console.error(e);
          log('ERROR: ' + (e?.message || String(e)));
        }
      });
    </script>
  </body>
</html>
